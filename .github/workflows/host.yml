name: host
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: git submodule update --init third_party/lvgl third_party/CANopenNode third_party/iso14229
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy cppcheck ninja-build
          python -m pip install -r tools/hil/requirements.txt -r tools/ota/requirements.txt
      - name: Build instrumented portable code
        run: |
          cmake -S . -B build-quality -G Ninja -DMETER_BUILD_UI=OFF -DMETER_ENABLE_UPDATE=ON -DMETER_SANITIZE=ON -DMETER_FUZZ=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-quality
      - name: ASan and UBSan
        run: ctest --test-dir build-quality --output-on-failure
      - name: Cppcheck OSS
        run: cppcheck --enable=warning,performance,portability --error-exitcode=1 --std=c11 -I . runtime core storage update
      - name: Clang analyzer and advisory checks
        run: |
          find core runtime storage update -name '*.c' -print0 | xargs -0 -n 1 clang-tidy -p build-quality
      - name: Bounded fuzz smoke
        run: build-quality/fuzz-runtime -max_total_time=30 -max_len=4096 -seed=1
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Checkout required public submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --jobs 4 \
            third_party/lvgl third_party/lvgl-aic third_party/CANopenNode third_party/iso14229
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev gcc g++ cpio u-boot-tools
          python -m pip install -r tools/hil/requirements.txt -r tools/ota/requirements.txt
      - name: Build shared OTA package inspector
        run: |
          cmake -S . -B build-package -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMETER_BUILD_UI=OFF
          cmake --build build-package --target meter-ota-inspect
      - name: Test HIL host utilities without hardware
        run: python -m pytest -q --junitxml=evidence/host-junit.xml
      - name: Build and test Demo
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Build and test optional CAN OTA framework
        run: |
          cmake -S . -B build-update -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMETER_BUILD_UI=OFF -DMETER_ENABLE_UPDATE=ON
          cmake --build build-update
          ctest --test-dir build-update --output-on-failure
      - name: Build and test Reference-B
        run: |
          cmake -S . -B build-reference -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMETER_PRODUCT_ROOT=examples/reference-b
          cmake --build build-reference
          ctest --test-dir build-reference --output-on-failure
      - name: Build and test Reference-Mixed
        run: |
          cmake -S . -B build-mixed -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMETER_PRODUCT_ROOT=examples/reference-mixed
          cmake --build build-mixed
          ctest --test-dir build-mixed --output-on-failure
      - name: Upload host test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-evidence
          path: evidence/
