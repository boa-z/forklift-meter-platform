name: host
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: git submodule update --init third_party/lvgl third_party/lvgl-aic third_party/iso14229 tools/ota products/demo
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev gcc g++ cpio u-boot-tools
          python -m pip install -r tools/hil/requirements.txt -r tools/ota/requirements.txt
      - name: Framework without a Product
        run: |
          cmake -S . -B build-framework -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMETER_PRODUCT_ROOT=
          cmake --build build-framework
          ctest --test-dir build-framework --output-on-failure
      - name: Demo with UI
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Headless with CAN OTA
        run: |
          cmake -S . -B build-update -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMETER_BUILD_UI=OFF -DMETER_ENABLE_UPDATE=ON
          cmake --build build-update
          ctest --test-dir build-update --output-on-failure
      - name: Host Python tools
        run: METER_OTA_INSPECTOR=$PWD/build-update/meter-ota-inspect python -m pytest -q
